name: J1 Walk-forward audit
on:
  workflow_dispatch:
    inputs:
      tickets:
        description: Tickets per evaluated draw
        required: true
        default: '1'
      window:
        description: Historical lookback window
        required: true
        default: '100'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run leakage-safe J1 walk-forward
        run: python j1_walkforward.py --csv data/all.csv --out reports/j1 --tickets '${{ inputs.tickets }}' --window '${{ inputs.window }}'
      - uses: actions/upload-artifact@v4
        with:
          name: j1-walkforward-report
          path: reports/j1/
