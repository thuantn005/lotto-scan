name: scan_inverse_all (diem cuoi = ky moi nhat, ghi seed >= n hit, tu dung truoc 6 gio va cho chay tiep)

on:
  workflow_dispatch:
    inputs:
      newest:
        description: "Ky moi nhat (seed bat buoc trung ky nay)"
        default: "977"
      chunks:
        description: "So job chia khong gian k (160-256). Moi job ~3-4 gio"
        default: "256"
      min_hits:
        description: "n = ghi seed co tong >= n ky trung (tinh ca ky moi nhat). Mac dinh 5"
        default: "5"
      max_minutes:
        description: "Job tu dung nhan khoi moi sau so phut nay (< 360). Phan chua quet duoc ghi vao inverse/con_lai_<ky>.txt"
        default: "320"
      resume:
        description: "CHAY TIEP: dan cac doan con lai 'kb-ke' (cach nhau dau cach/xuong dong, tu file con_lai). De trong = quet tu dau"
        default: ""

permissions:
  contents: write

concurrency:
  group: scan-inverse-all
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 make_draws_rank.py
          python3 - <<'PY'
          import os, json, re
          rows = {int(l.split()[0]): (int(l.split()[1]), int(l.split()[2])) for l in open("data/draws_rank.txt")}
          d = int("${{ inputs.newest }}"); assert d in rows, f"chua co ky {d} trong data/all.csv"
          resume = """${{ inputs.resume }}""".strip()
          if resume:
              rs = [tuple(map(int, x.split("-"))) for x in re.findall(r"\d+-\d+", resume)]
          else:
              n = int("${{ inputs.chunks }}")
              assert 160 <= n <= 256, "chunks phai trong 160-256 (moi job < 6 gio: ~760 gio-job / chunks)"
              ktot = (2**64 - 1 - rows[d][0]) // 324632 + 1
              rs = [(ktot * i // n, ktot * (i + 1) // n) for i in range(n)]
          inc = [{"part": i, "kb": a, "ke": b} for i, (a, b) in enumerate(rs)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f: f.write("matrix=" + json.dumps({"include": inc}) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: draws_rank
          path: data/draws_rank.txt

  scan:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: draws_rank
          path: data
      - name: build
        run: |
          grep -q avx512dq /proc/cpuinfo && F="-DSCAN_AVX512" || F=""
          g++ -O3 -march=native $F -pthread -std=c++17 scan_inverse_all.cpp -o scan_inverse_all
      - name: run chunk
        run: |
          P=${{ matrix.part }}
          ./scan_inverse_all data/draws_rank.txt ${{ inputs.newest }} ${{ matrix.kb }} ${{ matrix.ke }} $(nproc) out_$P.txt ${{ inputs.min_hits }} $(( ${{ inputs.max_minutes }} * 60 )) | tee summary_$P.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part_${{ matrix.part }}
          path: |
            out_*.txt
            out_*.txt.tiep
            summary_*.txt

  merge:
    needs: [prepare, scan]
    if: ${{ always() && needs.scan.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: part_*
          path: parts
          merge-multiple: true
      - name: gop ket qua
        run: |
          mkdir -p inverse; T=inverse/all_${{ inputs.newest }}_$(date +%s).txt
          cat parts/out_*[0-9].txt 2>/dev/null | sort -k2,2nr > full.txt || true
          {
            echo "SCAN_INVERSE_ALL diem cuoi ky ${{ inputs.newest }}, min_hits=${{ inputs.min_hits }}"
            echo "--- tong so seed: $(wc -l < full.txt) (seed so_hit cac_ky) ---"
            cat full.txt
          } > $T
          gzip -9 -c full.txt > $T.gz
          # doan chua quet duoc (het gio) hoac job loi -> dan vao o 'resume' de chay tiep
          python3 - <<'PY'
          import glob
          con = []
          for f in sorted(glob.glob("parts/*.tiep")):
              kb, stop, ke = map(int, open(f).read().split())
              if stop < ke: con.append(f"{stop}-{ke}")
          open("inverse/con_lai_${{ inputs.newest }}.txt", "w").write("\n".join(con) + ("\n" if con else ""))
          print("doan con lai:", len(con))
          PY
          git config user.name github-actions; git config user.email actions@github.com
          git add inverse; git commit -m "scan_inverse_all ${{ inputs.newest }}" || true
          git pull --rebase || true; git push
