name: Benchmark CPP Speed

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch data
        run: |
          mkdir -p data
          curl -sL "https://raw.githubusercontent.com/NhanAZ-Data/vietlott-research/main/datasets/draws/lotto535/all.csv" -o data/all.csv
          wc -l data/all.csv

      - name: Compile C++
        run: g++ -O3 -march=x86-64-v3 -funroll-loops -o scan_j1_cpp scan_j1.cpp

      - name: Kiem chung 4 seed J1=2 da biet
        run: |
          for seed in 10015838883 10036936239 10168595334 10183485194; do
            echo "=== seed=$seed ==="
            CSV_PATH=data/all.csv OUT_PATH=/tmp/verify_$seed.json \
            SCAN_START=$seed SCAN_END=$seed MIN_LOG=2 \
            ./scan_j1_cpp
          done

      - name: Benchmark toc do
        run: |
          CSV_PATH=data/all.csv OUT_PATH=/tmp/bench.json \
          SCAN_START=1 SCAN_END=2000000 MIN_LOG=3 \
          ./scan_j1_cpp
