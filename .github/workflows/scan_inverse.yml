name: scan_inverse (tim seed 64-bit trung nhieu ky bang cach dao hash)

on:
  workflow_dispatch:
    inputs:
      d1:
        description: "Ky 1 (liet ke moi seed trung ky nay)"
        default: "971"
      d2:
        description: "Ky 2 (loc: seed phai trung ca ky nay)"
        default: "970"
      chunks:
        description: "So job chia khong gian k (<=20 de chay song song)"
        default: "20"
      min_hits:
        description: "Ghi seed co >= so ky trung nay"
        default: "3"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      ktotal: ${{ steps.m.outputs.ktotal }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 make_draws_rank.py
          python3 - <<'PY'
          import os, json
          rows = {int(l.split()[0]): (int(l.split()[1]), int(l.split()[2])) for l in open("data/draws_rank.txt")}
          d1 = int("${{ inputs.d1 }}"); n = int("${{ inputs.chunks }}")
          assert d1 in rows and int("${{ inputs.d2 }}") in rows and d1 != int("${{ inputs.d2 }}")
          ktot = (2**64 - 1 - rows[d1][0]) // 324632 + 1
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps(list(range(n))) + "\n"); f.write(f"ktotal={ktot}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: draws_rank
          path: data/draws_rank.txt

  scan:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: draws_rank
          path: data
      - name: build
        run: g++ -O3 -march=native -pthread -std=c++17 scan_inverse.cpp -o scan_inverse
      - name: run chunk
        run: |
          K=${{ needs.prepare.outputs.ktotal }}; N=${{ inputs.chunks }}; P=${{ matrix.part }}
          KB=$(python3 -c "print($K*$P//$N)"); KE=$(python3 -c "print($K*($P+1)//$N)")
          ./scan_inverse data/draws_rank.txt ${{ inputs.d1 }} ${{ inputs.d2 }} $KB $KE $(nproc) out_$P.txt ${{ inputs.min_hits }} | tee summary_$P.txt
      - uses: actions/upload-artifact@v4
        with:
          name: part_${{ matrix.part }}
          path: |
            out_*.txt
            summary_*.txt

  merge:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: part_*
          path: parts
          merge-multiple: true
      - name: gop ket qua
        run: |
          mkdir -p inverse; T=inverse/ket_qua_${{ inputs.d1 }}_${{ inputs.d2 }}.txt
          {
            echo "SCAN_INVERSE d1=${{ inputs.d1 }} d2=${{ inputs.d2 }} (moi seed 64-bit trung ca 2 ky), min_hits=${{ inputs.min_hits }}"
            echo "--- tong ket tung phan ---"; cat parts/summary_*.txt
            echo "--- seed co >= ${{ inputs.min_hits }} ky trung: seed so_hit cac_ky (sap giam theo so hit) ---"
            cat parts/out_*.txt | sort -k2,2nr | head -2000
          } > $T
          head -20 $T
          git config user.name github-actions; git config user.email actions@github.com
          git add inverse; git commit -m "scan_inverse ${{ inputs.d1 }}_${{ inputs.d2 }}" || true; git push || true
