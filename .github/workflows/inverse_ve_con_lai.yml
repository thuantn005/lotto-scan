name: inverse_ve_con_lai (tu dong tinh ve con lai + 1-2 seed, tu quet them cap)

on:
  workflow_dispatch:
    inputs:
      draw:
        description: "Ky can tinh (de trong = ky sap quay)"
        default: ""
      target:
        description: "So ve con lai muc tieu"
        default: "1"
      auto_scan:
        description: "Con lai > target thi tu dong chay scan_inverse_first2 them cap (true/false)"
        default: "true"
      max_pairs:
        description: "So cap toi da moi lan de xuat quet"
        default: "12"
      export_loai:
        description: "Xuat ca danh sach ve bi loai (loai_<ky>.txt.gz, ~10 MB) len artifact"
        default: "false"
      mode:
        description: "dup = ve con lai la ve bi loai do seed trung >= min_pairs cap; old = cach cu (ve khong seed nao sinh ra)"
        default: "dup"
      min_pairs:
        description: "(mode dup) so cap khac nhau toi thieu cung sinh ra mot ve"
        default: "2"
      top:
        description: "(mode dup) chi giu N ve co nhieu cap trung nhat, 0 = giu tat ca"
        default: "0"
  workflow_run:
    workflows: ["scan_inverse_first2 (noi tiep nhieu cap d1:d2, hit dau = d1, hit thu 2 = d2)"]
    types: [completed]
  # TAT cron GitHub (dung cron ben ngoai goi workflow_dispatch): schedule:
  # - cron: "30 5 * * *"    # 12:30 VN, truoc ky 13h
  # - cron: "30 13 * * *"   # 20:30 VN, truoc ky 21h

permissions:
  contents: write
  actions: write

concurrency:
  group: inverse-ve-con-lai
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DRAW: ${{ inputs.draw }}
      TARGET: ${{ inputs.target || '1' }}
      MAX_PAIRS: ${{ inputs.max_pairs || '12' }}
      EXPORT_LOAI: ${{ inputs.export_loai || 'false' }}
      MODE: ${{ inputs.mode || 'dup' }}
      MIN_PAIRS: ${{ inputs.min_pairs || '2' }}
      TOP: ${{ inputs.top || '0' }}
      AUTO_SCAN: ${{ inputs.auto_scan || 'true' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas
      - name: tai seed inverse tu Release
        run: |
          mkdir -p inverse
          gh release download lotto535-inverse-archive --dir inverse --skip-existing
          ls inverse | wc -l
      - id: calc
        run: python3 ve_con_lai_auto.py
      - name: Upload danh sach ve bi loai
        if: env.EXPORT_LOAI == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ve-loai-${{ steps.calc.outputs.draw }}
          path: ve_con_lai/loai_*.txt.gz
      - name: Commit ket qua
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ve_con_lai
          if git diff --cached --quiet; then echo "khong co thay doi"; else
            git commit -m "ve con lai ky ${{ steps.calc.outputs.draw }}: ${{ steps.calc.outputs.remaining }} ve"
            for i in 1 2 3 4 5; do git pull --rebase -q && git push && break || sleep 5; done
          fi
      - name: Tu dong quet them cap neu con lai > target
        if: env.AUTO_SCAN == 'true' && steps.calc.outputs.next_queue != ''
        run: |
          running=$(gh run list --workflow scan_inverse_first2.yml --json status -q '[.[]|select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending")]|length')
          if [ "$running" = "0" ]; then
            gh workflow run scan_inverse_first2.yml -f queue="${{ steps.calc.outputs.next_queue }}" -f chunks=20 -f min_hits=2
            echo "da dispatch: ${{ steps.calc.outputs.next_queue }}"
          else
            echo "scan_inverse_first2 dang chay ($running), khong dispatch them"
          fi
