      - name: Gop 20 chunk thanh l1_merged/merged_seed{X}.json (dung format cu)
        env:
          SEED_START: ${{ env.ONCE2_SEED_START }}
          BATCH_SIZE: ${{ env.ONCE_BATCH_SIZE }}
        run: |
          set -e
          mkdir -p l1_merged
          python3 << 'PY'
          import json
          import os
          from pathlib import Path

          seed_start = int(os.environ["SEED_START"])
          batch_size = int(os.environ["BATCH_SIZE"])
          seed_end = seed_start + 20 * batch_size - 1

          draws_by_id = {}
          for i in range(20):
              p = Path(f"artifacts/v2once2-chunk-{i}/chunk_{i}.json")
              data = json.loads(p.read_text(encoding="utf-8"))
              for d in data.get("draws", []):
                  did = d["draw_id"]
                  entry = draws_by_id.setdefault(did, {"draw_id": did, "draw_date": d["draw_date"], "seeds": []})
                  entry["seeds"].extend(d.get("seeds", []))

          draws = []
          total_found = 0
          for did in sorted(draws_by_id.keys()):
              entry = draws_by_id[did]
              entry["seeds"].sort()
              entry["found"] = len(entry["seeds"])
              total_found += entry["found"]
              draws.append(entry)

          out = {
              "seed_start": seed_start,
              "seed_end": seed_end,
              "total_draws": len(draws),
              "total_found": total_found,
              "draws": draws,
          }
          # Dung dung ten file ma scan_per_draw.cpp / check_l1_merged.py mac
          # dinh dung (merged_seed{seed_start}.json) - nam CHUNG thu muc
          # l1_merged/ voi file dang chay lien tuc (FIXED_SEED_START khac
          # ONCE_SEED_START nen khong dung file, khong bi ghi de).
          out_path = Path(f"l1_merged/merged_seed{seed_start}.json")
          out_path.write_text(json.dumps(out, separators=(",", ":")), encoding="utf-8")
          print(f"Da gop {len(draws)} ky, tong {total_found} luot trung J1, ghi vao {out_path}")
          PY

      # 1000 ky x ~8.000 seed/ky ~ 110MB > gioi han 100MB cua GitHub -> tia ky CU NHAT cho vua 90MB.
      - name: Gioi han kich thuoc l1_merged (toi da 90MB, tia ky qua cu neu vuot)
        run: python3 prune_merged_seed.py --file l1_merged/merged_seed${{ env.ONCE2_SEED_START }}.json --cap-bytes 94371840

      - name: Commit ket qua
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash push -u -m "scan model phu 3 (5ky) truoc rebase" || true
          git pull --rebase origin main
          git stash pop || true
          [ -d l1_merged ] && git add l1_merged/ || true
          [ -d l2_merged ] && git add l2_merged/ || true
          [ -d "${{ env.ONCE2_CHUNK_DIR }}" ] && git add "${{ env.ONCE2_CHUNK_DIR }}/" || true
          if git diff --cached --quiet; then
            echo "Khong co gi de commit"
            exit 0
          fi
          git commit -m "scan v2 model phu 3 (5ky): seed ${{ env.ONCE2_SEED_START }} (+20x${{ env.ONCE_BATCH_SIZE }}), ${{ env.ONCE2_LAST_N_DRAWS }} ky gan nhat, ky moi $(date -u +%Y-%m-%d\ %H:%M) UTC"
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "Push thanh cong (lan thu $i)"
              break
            fi
            echo "Push bi tu choi (co the do job khac vua push truoc), thu pull --rebase roi push lai... (lan $i/5)"
            git pull --rebase origin main
            sleep $((i * 5))
            if [ "$i" = "5" ]; then
              echo "Push that bai sau 5 lan thu, dung lai"
              exit 1
            fi
          done

