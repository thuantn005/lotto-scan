name: Cap nhat du lieu Lotto 5/35 (2 lan/ngay theo lich Vietlott) - KHONG quet seed

# Workflow nay CHI cap nhat du lieu + thong bao:
#   - tai data/all.csv, bo sung ky con thieu tu nguon du phong
#   - cao ket qua day du (data/full_results.json), tinh trang thai chia giai
#   - commit data/all.csv, data/full_results.json, share_draw_state.json
#   - danh thuc app qua FCM
# DA BO: quet l1-1 / l1-2 / l1-3 (scan_per_draw), gop L2, va job du doan l1-3.
# Cac thu muc l1-1/ l1-2/ l1-3/ l1_cache/ l2_merged/ giu nguyen, khong con duoc cap nhat.

on:
  schedule:
    # 3h sau ky quay 13:00 VN -> 16:00 VN = 09:00 UTC
    - cron: "0 9 * * *"
    # 3h sau ky quay 21:00 VN -> 00:00 VN hom sau = 17:00 UTC cung ngay
    - cron: "0 17 * * *"
    # chay LAI du phong (khi nguon du lieu len ket qua tre) - khong commit neu khong co gi moi
    - cron: "0 11 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: {}
  push:
    tags:
      - 'run-*'

permissions:
  contents: write

concurrency:
  group: update-data-single-runner
  cancel-in-progress: false

jobs:
  update_data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: main

      - name: Download dataset moi nhat + GOP voi data/all.csv trong repo (khong mat ky)
        run: |
          set -e
          mkdir -p data
          curl -fsL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 15 "https://raw.githubusercontent.com/NhanAZ-Data/vietlott-research/main/datasets/draws/lotto535/all.csv" -o data/all.new || { echo "::warning::Tai dataset that bai, dung file hien co + fallback"; : > data/all.new; }
          python3 merge_all_csv.py --new data/all.new --old data/all.csv
          rm -f data/all.new
          wc -l data/all.csv

      - name: Fallback cao xosominhngoc.net.vn neu dataset cham cap nhat
        run: |
          set -e
          python3 scrape_xosominhngoc_fallback.py --csv data/all.csv --lookback-days 14
          wc -l data/all.csv

      - name: Cao ket qua day du (jackpot + bang 7 giai) ra JSON
        run: |
          set -e
          python3 scrape_full_result_json.py --json data/full_results.json --lookback-days 2

      - name: Tinh trang thai ky chia giai (server-side, khong de app tu tinh)
        id: share_state
        run: |
          set -e
          python3 update_share_draw_state.py \
            --results data/full_results.json \
            --state share_draw_state.json \
            --csv data/all.csv \
            | tee /tmp/share_state_out.txt
          grep -q "NEW_EVENT=true" /tmp/share_state_out.txt \
            && echo "new_event=true" >> "$GITHUB_OUTPUT" \
            || echo "new_event=false" >> "$GITHUB_OUTPUT"

      - name: Kiem tra CSV khong thieu ky (lo + ky moi nhat theo lich quay)
        id: verify
        run: python3 check_csv_complete.py data/all.csv

      - name: Commit data/full_results.json + share_draw_state.json (luon chay, khong cho should_run)
        id: commit_full_results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash push -u -m "truoc khi commit full_results.json" || true
          git pull --rebase origin main
          git stash pop || true
          [ -f data/all.csv ] && git add data/all.csv || true
          [ -f data/full_results.json ] && git add data/full_results.json || true
          [ -f share_draw_state.json ] && git add share_draw_state.json || true
          if git diff --cached --quiet; then
            echo "full_results.json khong doi, khong co gi de commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "cap nhat full_results.json (jackpot) $(date -u +%Y-%m-%d\ %H:%M) UTC"
            for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "Push thanh cong (lan thu $i)"
              break
            fi
            echo "Push bi tu choi, thu pull --rebase roi push lai... (lan $i/5)"
            git pull --rebase origin main
            sleep $((i * 5))
            if [ "$i" = "5" ]; then
              echo "Push that bai sau 5 lan thu, dung lai"
              exit 1
            fi
          done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Danh thuc app qua FCM (data message, app tu quyet dinh co bao hay khong)
        if: steps.commit_full_results.outputs.changed == 'true' || steps.share_state.outputs.new_event == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          set -e
          pip install --quiet google-auth requests
          python3 send_fcm_push.py --topic chiagiai_updates

      - name: BAO LOI neu con thieu ky (sau khi da commit phan co duoc)
        if: steps.verify.outputs.bad == 'true'
        run: |
          echo "::error::Con thieu ky - se tu thu lai o lan chay tiep theo (cron du phong)"
          exit 1
