name: Scan V2 (2 lan/ngay theo lich Vietlott)

on:
  schedule:
    # 3h sau ky quay 13:00 VN -> 16:00 VN = 09:00 UTC
    - cron: "0 9 * * *"
    # 3h sau ky quay 21:00 VN -> 00:00 VN hom sau = 17:00 UTC cung ngay
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      seed_count:
        description: "So seed quet lan nay (vd: 31155516000 cho 1 batch ~31 ty)"
        required: true
        default: "31155516000"

env:
  FIXED_SEED_START_LAST10: "35742585136"
  FIXED_SEED_COUNT_LAST10: "31155516000"

permissions:
  contents: write

concurrency:
  group: scan-v2-single-runner
  cancel-in-progress: false

jobs:
  scan_and_check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Download dataset moi nhat
        run: |
          set -e
          mkdir -p data
          curl -sL "https://raw.githubusercontent.com/NhanAZ-Data/vietlott-research/main/datasets/draws/lotto535/all.csv" -o data/all.csv
          wc -l data/all.csv

      - name: Kiem tra ky moi nhat, bo qua neu da quet roi
        id: check_ky
        run: |
          set -e
          LATEST_KY=$(tail -n 1 data/all.csv | cut -d',' -f2)
          echo "Ky moi nhat trong dataset: $LATEST_KY"

          if [ -f last_ky.txt ]; then
            LAST_SCANNED=$(cat last_ky.txt)
          else
            LAST_SCANNED=""
          fi
          echo "Ky da quet lan truoc: $LAST_SCANNED"

          if [ "$LATEST_KY" = "$LAST_SCANNED" ]; then
            echo "Ky $LATEST_KY da quet roi, bo qua lan nay."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Ky $LATEST_KY la ky moi, se chay scan."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
          echo "LATEST_KY=$LATEST_KY" >> "$GITHUB_ENV"

      - name: Compile scan_v2 (co pthread cho da luong)
        if: steps.check_ky.outputs.should_run == 'true'
        run: g++ -O3 -march=x86-64-v3 -funroll-loops -std=c++17 -pthread -o scan_v2 scan_v2.cpp

      - name: Xem so core cua runner
        if: steps.check_ky.outputs.should_run == 'true'
        run: nproc

      - name: Check lai l1 (thang hang seed J1>=2 len l2, gioi han 20 batch)
        if: steps.check_ky.outputs.should_run == 'true'
        env:
          CSV_PATH: data/all.csv
          MODE: check_l1
          L1_DIR: l1
          L2_DIR: l2
        run: ./scan_v2

      # ===== BUOC MOI: quet 10 KY GAN NHAT, J1 KIEM TRA 1 LAN CHO CA 10 KY =====
      # Dai seed CO DINH (khong resume, khong phinh to): moi lan chay deu quet
      # LAI dung 31.155.516.000 seed tu FIXED_SEED_START_LAST10, chi 10 KY
      # dang xet la thay doi theo ngay (ky nao roi khoi cua so 10 ky gan nhat
      # se TU DONG bi loai khoi file — chi luu dung 10 ky).
      - name: Compile scan_last_n (quet 10 ky gan nhat)
        if: steps.check_ky.outputs.should_run == 'true'
        run: g++ -O3 -march=x86-64-v3 -funroll-loops -std=c++17 -pthread -o scan_last_n scan_last_n.cpp

      - name: Quet lai dai seed CO DINH cho 10 ky gan nhat (khong resume, khong phinh to)
        if: steps.check_ky.outputs.should_run == 'true'
        env:
          CSV_PATH: data/all.csv
          OUT_DIR: l1_merged_last10
          OUT_NAME: merged_seed${{ env.FIXED_SEED_START_LAST10 }}.json
          SEED_START: ${{ env.FIXED_SEED_START_LAST10 }}
          SEED_COUNT: ${{ env.FIXED_SEED_COUNT_LAST10 }}
          LAST_N_DRAWS: "10"
        run: ./scan_last_n

      - name: So sanh ket qua giua 10 ky + thang hang len l2_merged_last10
        if: steps.check_ky.outputs.should_run == 'true'
        env:
          L1_MERGED_FILE: l1_merged_last10/merged_seed${{ env.FIXED_SEED_START_LAST10 }}.json
          L2_MERGED_DIR: l2_merged_last10
        run: python3 check_l1_merged.py
      # ===== HET BUOC MOI =====

      - name: Commit ket qua
        if: steps.check_ky.outputs.should_run == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash push -u -m "ket qua truoc rebase" || true
          git pull --rebase origin main
          git stash pop || true
          echo "$LATEST_KY" > last_ky.txt
          # QUAN TRONG: add tung duong dan RIENG, vi neu 1 duong dan khong ton tai
          # (vi du l2/ chua co seed nao duoc thang hang) thi ca lenh "git add a b c"
          # se that bai voi exit code != 0 va KHONG add duoc gi ca, du 2>/dev/null||true
          [ -d l1 ] && git add l1/ || true
          [ -d l2 ] && git add l2/ || true
          [ -f l1_state.json ] && git add l1_state.json || true
          [ -f last_ky.txt ] && git add last_ky.txt || true
          [ -d l1_merged_last10 ] && git add l1_merged_last10/ || true
          [ -d l2_merged_last10 ] && git add l2_merged_last10/ || true
          if git diff --cached --quiet; then
            echo "Khong co gi de commit"
            exit 0
          fi
          git commit -m "scan v2: cap nhat sau ky quay $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git push origin main
