name: Cap nhat du lieu Lotto 5/35 (2 lan/ngay) + TU QUET seed inverse den khi con target ve + tia cap thua

# Workflow nay cao ket qua (6 so + so dac biet) cap nhat data/all.csv, doi chieu ve du doan va sinh ve ky tiep:
#   - tai data/all.csv, bo sung ky con thieu tu nguon du phong
#   - kiem tra khong thieu ky
#   - LUU VE TRUNG: doi chieu 100 ve du doan (du_doan/) voi ket qua that -> ve_trung/<game>_<ky>.txt + tong_ket (luu_ve_trung.py)
#   - cap nhat muc seed (seed_levels.py) + chon DUNG 100 ve du doan ky tiep theo cho Lotto va Mega (du_doan_100.py)
#   - commit data + du_doan + ve_trung + seed_state (khong con file muc/nang)
# THEM MOI: cao ket qua Mega 6/45 (dataset NhanAZ-Data + fallback xosominhngoc) vao data/mega_all.csv, commit cung data/all.csv.
# THEM MOI: sau moi lan cap nhat ky moi, TU QUET CAP KY MOI NHAT (ky-1, ky) neu chua quet (dau da quet: scan_state/first2_A_B.txt).
# THEM MOI (tu dong het): sau khi sinh ve, neu ve con lai > target thi tu quet them cap seed inverse
#   (matrix 20 job, gz luu tren Release (khong luu inverse/ trong repo), tu goi lai workflow nay voi skip_update=true) cho den khi
#   con <= target; khi dat target thi xoa gz cua cap thua khoi repo (giu file .txt nho trong repo lam dau da quet).
# DA BO tu truoc: quet l1-1 / l1-2 / l1-3 (scan_per_draw), gop L2, va job du doan l1-3.

on:
  # TAT cron GitHub (dung cron ben ngoai goi workflow_dispatch): schedule:
  # # 3h sau ky quay 13:00 VN -> 16:00 VN = 09:00 UTC
  # - cron: "0 9 * * *"
  # # 3h sau ky quay 21:00 VN -> 00:00 VN hom sau = 17:00 UTC cung ngay
  # - cron: "0 17 * * *"
  # # chay LAI du phong (khi nguon du lieu len ket qua tre) - khong commit neu khong co gi moi
  # - cron: "0 11 * * *"
  # - cron: "0 19 * * *"
  # # Mega 6/45 quay Thu 4/Thu 6/CN luc 18:00 VN -> cao ket qua 18:40 VN = 11:40 UTC (cac ngay khac chi cap nhat, khong co ky moi)
  # - cron: "40 11 * * *"
  workflow_dispatch:
    inputs:
      skip_update:
        description: "true = bo qua buoc cap nhat du lieu (dung cho vong quet tu goi lai)"
        default: "false"
      target:
        description: "So ve con lai muc tieu"
        default: "1"
      chunks:
        description: "So job quet song song (<=20)"
        default: "20"
      min_hits:
        description: "Ghi seed co tong >= so ky trung nay"
        default: "2"
      max_new_pairs:
        description: "Toi da so cap quet moi trong 1 chuoi (chong chay vo han)"
        default: "60"
      prune:
        description: "true = xoa cap (KHONG khuyen dung: 400/40 cap duoc chon lai moi ky nen phai giu DAY DU cap)"
        default: "false"
      max_pairs:
        description: "0 = giu day du moi cap (khong cua so truot). >0 = chi giu N cap moi nhat va XOA cap cu"
        default: "0"
      keep_pairs:
        description: "0 = KHONG GIOI HAN: quet TAT CA cap lich su (mac dinh). N>0 = dung khi co du N cap gz tren Release"
        default: "0"
      chon_pairs:
        description: "So cap duoc CHON moi ky de loai ve (chon_cap_loai.py)"
        default: "40"
      release_tag:
        description: "Tag Release chua gz Lotto (khong luu inverse/ trong repo nua)"
        default: "lotto535-inverse-archive"
      use_pairs:
        description: "So cap MOI NHAT dung de LOAI ve / sinh ve du doan / doi chieu (khong xoa gi)"
        default: "40"
      scan_tren_github:
        description: "true = quet cap Lotto tren GitHub (mac dinh, theo yeu cau). false = chi quet bang quet_local.py"
        default: "true"
      so_ve:
        description: "0 = KHONG rang buoc so ve: chon dung N cap (chon_pairs) roi lay MOI ve con lai lam du doan (ghi toi da 100 ve). >0 = chon them cap cho toi khi con <= N ve"
        default: "0"
      levels_backfill:
        description: "So ky cuoi duoc tinh lai muc seed moi lan chay (3 binh thuong; dat lon, vd 300, de backfill lan dau)"
        default: "3"
      scan_newest:
        description: "true = luon quet cap ky moi nhat (d1=ky-1, d2=ky) truoc khi xet target"
        default: "true"
      auto_scan:
        description: "false = chi cap nhat + sinh ve, khong tu quet them"
        default: "true"
      pairs_added:
        description: "(noi bo) so cap da quet trong chuoi nay"
        default: "0"
  push:
    tags:
      - 'run-*'

permissions:
  contents: write
  actions: write

jobs:
  update_data:
    if: ${{ inputs.skip_update != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: update-data-single-runner
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag || 'lotto535-inverse-archive' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: main

      - name: Download dataset moi nhat + GOP voi data/all.csv trong repo (khong mat ky)
        run: |
          set -e
          mkdir -p data
          bash fetch_dataset.sh lotto535 data/all.new
          python3 merge_all_csv.py --new data/all.new --old data/all.csv
          rm -f data/all.new
          wc -l data/all.csv

      - name: Fallback cao xosominhngoc.net.vn neu dataset cham cap nhat
        run: |
          set -e
          python3 scrape_xosominhngoc_fallback.py --csv data/all.csv --lookback-days 14
          wc -l data/all.csv

      - name: Kiem tra CSV khong thieu ky (lo + ky moi nhat theo lich quay)
        id: verify
        run: python3 check_csv_complete.py data/all.csv

      - name: Cai Python + numpy/pandas
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cao ket qua Mega 6/45 -> data/mega_all.csv (dataset + fallback, loi khong lam hong cac buoc khac)
        continue-on-error: true
        run: |
          mkdir -p data
          bash fetch_dataset.sh mega645 data/mega_all.new
          [ -s data/mega_all.new ] && python3 merge_all_csv.py --new data/mega_all.new --old data/mega_all.csv || echo "bo qua merge (khong co du lieu moi)"
          rm -f data/mega_all.new
          python3 scrape_mega_fallback.py --csv data/mega_all.csv --lookback-days 14 || echo "::warning::fallback Mega loi"
          python3 check_mega_csv.py data/mega_all.csv || true
          wc -l data/mega_all.csv

      - name: Cai numpy + pandas
        run: pip install -q numpy pandas

      - name: LUU VE TRUNG (doi chieu ve du doan voi ket qua that - Lotto + Mega)
        run: python3 luu_ve_trung.py

      # DU DOAN MOI: chon CAP khong trung truoc (chi tai cap duoc chon tu Release), VE CON LAI = du doan
      - name: LOTTO - chon cap khong trung -> ve con lai = du doan ky tiep (du_doan/ + chon_cap/)
        continue-on-error: true
        env:
          KEEP: ${{ inputs.chon_pairs || '40' }}
          TARGET: ${{ inputs.so_ve || '0' }}
        run: python3 chon_cap_release.py lotto535 "$TAG"

      - name: LOTTO - bao cao tom tat moi ky (bao_cao/tom_tat_lotto535.txt)
        continue-on-error: true
        run: python3 bao_cao_tom_tat.py || echo "::warning::bao_cao_tom_tat loi"

      - name: MEGA - chon cap khong trung -> ve con lai = du doan ky tiep (du_doan/ + chon_cap/)
        continue-on-error: true
        env:
          KEEP: "400"
          TARGET: ${{ inputs.so_ve || '0' }}
        run: python3 chon_cap_release.py mega mega-inverse-archive

      - name: Don file nang cu (muc_trung, muc_theo_cap, ve_con_lai...) - chi giu 100 ve du doan + ve trung
        run: |
          rm -rf ve_con_lai ve_con_lai_mega ve_theo_muc out_muc   # giu ve_trung_mega (nho) de luu ve trung Mega
          rm -f ve_trung/muc_trung_*.txt ve_trung/muc_doi_chieu.jsonl ve_trung/muc_doi_chieu.txt
          du -sh ve_trung du_doan seed_state 2>/dev/null || true

      - name: Commit data/all.csv + ve du doan + ve trung (luon chay, khong cho should_run)
        id: commit_data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash push -u -m "truoc khi commit all.csv" || true
          git pull --rebase origin main
          git stash pop || true
          [ -f data/all.csv ] && git add data/all.csv || true
          [ -f data/mega_all.csv ] && git add data/mega_all.csv || true
          # add TUNG thu muc rieng: 1 pathspec khong ton tai lam git add loi va KHONG stage gi ca (du_doan bi bo sot)
          for p in ve_trung du_doan chon_cap seed_state bao_cao ve_con_lai ve_con_lai_mega ve_trung_mega ve_theo_muc; do
            if [ -e "$p" ] || git ls-files --error-unmatch "$p" >/dev/null 2>&1; then git add -A -- "$p" || true; fi
          done
          if git diff --cached --quiet; then
            echo "khong co gi de commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "cap nhat all.csv + ve du doan $(date -u +%Y-%m-%d\ %H:%M) UTC"
            for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "Push thanh cong (lan thu $i)"
              break
            fi
            echo "Push bi tu choi, thu pull --rebase roi push lai... (lan $i/5)"
            git pull --rebase origin main
            sleep $((i * 5))
            if [ "$i" = "5" ]; then
              echo "Push that bai sau 5 lan thu, dung lai"
              exit 1
            fi
          done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: BAO LOI neu con thieu ky (sau khi da commit phan co duoc)
        if: steps.verify.outputs.bad == 'true'
        run: |
          echo "::error::Con thieu ky - se tu thu lai o lan chay tiep theo (cron du phong)"
          exit 1

  # ===================== TU QUET seed inverse + TIA CAP (Lotto 5/35) =====================
  plan:
    needs: update_data
    # chay sau khi cap nhat xong (hoac khi vong quet tu goi lai bo qua cap nhat)
    if: ${{ always() && inputs.auto_scan != 'false' && (needs.update_data.result == 'success' || needs.update_data.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: scan-loop-plan
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag || 'lotto535-inverse-archive' }}
    outputs:
      go: ${{ steps.p.outputs.go }}
      need_more: ${{ steps.p.outputs.need_more }}
      d1: ${{ steps.p.outputs.d1 }}
      d2: ${{ steps.p.outputs.d2 }}
      ktotal: ${{ steps.p.outputs.ktotal }}
      matrix: ${{ steps.p.outputs.matrix }}
      newest: ${{ steps.p.outputs.newest }}
      nxt: ${{ steps.p.outputs.nxt }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy pandas
      - name: Tranh chay chong (khong de 2 chuoi quet song song)
        id: busy
        run: |
          OTHERS=$(gh run list --workflow scan_v2_auto.yml --json databaseId,status -q "[.[]|select(.databaseId != $GITHUB_RUN_ID)|select(.status==\"in_progress\" or .status==\"queued\" or .status==\"waiting\" or .status==\"pending\")]|length")
          echo "run khac dang chay/cho: $OTHERS"
          # chay theo lich/thu cong chi bat dau chuoi quet khi khong co run nao khac; vong tu goi lai (skip_update=true) luon di tiep
          if [ "${{ inputs.skip_update }}" != "true" ] && [ "$OTHERS" != "0" ]; then echo "busy=true" >> $GITHUB_OUTPUT; else echo "busy=false" >> $GITHUB_OUTPUT; fi
      - name: Doc danh sach gz tren Release + lap ke hoach
        id: p
        env:
          BUSY: ${{ steps.busy.outputs.busy }}
          TARGET: ${{ inputs.target || '1' }}
          CHUNKS: ${{ inputs.chunks || '20' }}
          MAXP: ${{ inputs.max_pairs || '0' }}
          KEEP: ${{ inputs.keep_pairs || '0' }}
          SCAN_NEWEST: ${{ inputs.scan_newest || 'true' }}
        run: |
          if [ "$BUSY" = "true" ]; then echo "go=false" >> $GITHUB_OUTPUT; exit 0; fi
          mkdir -p inverse
          gh release view "$TAG" --json assets -q '.assets[].name' > release_assets.txt 2>/dev/null || : > release_assets.txt
          wc -l < release_assets.txt
          python3 make_draws_rank.py
          python3 - <<PY
          import os, re, glob
          mx = int(os.environ["MAXP"])
          top = max(int(l.split()[0]) for l in open("data/draws_rank.txt"))
          want = {(top - 1 - k, top - k) for k in range(mx)} if mx > 0 else None   # cua so: mx cap LIEN TIEP (top-1,top), (top-2,top-1), ...
          def pr(f):
              m = re.search(r"first2_(\d+)_(\d+)", f); return (int(m.group(1)), int(m.group(2)))
          fs = glob.glob("inverse/first2_*_*.txt.gz")
          old = [f for f in fs if want is not None and pr(f) not in want]
          open("old_pairs.txt", "w").write("\n".join(os.path.basename(f) for f in old))
          print("cua so lien tiep:", sorted(want) if want else "khong gioi han", "| xoa cap ngoai cua so:", len(old))
          PY
          NXT=$(python3 -c "print(max(int(l.split()[0]) for l in open('data/draws_rank.txt'))+1)")
          echo "{\"next_draw\": $NXT, \"need_more\": false, \"drop\": []}" > plan.json   # loai ve theo cap do chon_cap_loai.py lam, khong dung auto_prune.py nua
          python3 - <<PY
          import os, json, re, glob
          plan = json.load(open("plan.json"))
          rows = {int(l.split()[0]): int(l.split()[1]) for l in open("data/draws_rank.txt")}
          done = set()
          for f in os.listdir("scan_state") if os.path.isdir("scan_state") else []:
              m = re.fullmatch(r"first2_(\d+)_(\d+)\.txt", f)
              if m: done.add((int(m.group(1)), int(m.group(2))))
          have = {(int(m.group(1)), int(m.group(2))) for l in open("release_assets.txt") for m in [re.fullmatch(r"first2_(\d+)_(\d+)\.txt\.gz", l.strip())] if m}
          done = set(have)   # DA QUET = co gz tren Release (cap bi mat gz phai quet lai)
          top = max(rows)
          newest = (top - 1, top)   # cap ky MOI NHAT trong du lieu
          newest_pending = os.environ.get("SCAN_NEWEST", "true") == "true" and (top - 1) in rows and newest not in done
          mx = int(os.environ["MAXP"])
          # have: lay tu Release (o tren)
          if mx > 0:       # che do cua so: chi quet cap LIEN TIEP con thieu (cap moi nhat truoc); du mx cap thi dung
              miss = [(top - 1 - k, top - k) for k in range(mx) if (top - 1 - k) in rows and (top - k) in rows and (top - 1 - k, top - k) not in have]
              pending = bool(miss); newest_pending = pending
              if pending: newest = miss[0]
          else:
              keep = int(os.environ.get("KEEP", "0"))
              cand0 = [(a, a + 1) for a in range(top - 1, 0, -1) if a in rows and a + 1 in rows and (a, a + 1) not in done]
              pending = newest_pending or ((len(have) < keep and bool(cand0)) if keep > 0 else bool(cand0))   # keep=0: quet TAT CA cap
          out = {"go": "true", "need_more": "true" if pending else "false", "nxt": plan["next_draw"], "newest": f"{newest[0]}_{newest[1]}", "newest_pending": str(newest_pending).lower()}
          if pending:
              if newest_pending:
                  d1, d2 = newest
              else:
                  pref = (top - 1) % 2
                  cand = [(a, a + 1) for a in range(top - 1, 0, -1) if a in rows and a + 1 in rows and (a, a + 1) not in done]
                  assert cand, "het cap de quet"
                  cand.sort(key=lambda p: (p[0] % 2 != pref, -p[0]))
                  d1, d2 = cand[0]
              out.update(d1=d1, d2=d2, ktotal=(2**64 - 1 - rows[d1]) // 324632 + 1, matrix=json.dumps(list(range(int(os.environ["CHUNKS"])))))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for k, v in out.items(): f.write(f"{k}={v}\n")
          print(out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: plan_files
          path: |
            plan.json
            old_pairs.txt
            ve_con_lai_*.txt
            data/draws_rank.txt
          if-no-files-found: ignore

  scan:
    needs: plan
    if: ${{ inputs.scan_tren_github == 'true' && needs.plan.outputs.go == 'true' && needs.plan.outputs.need_more == 'true' && fromJson(inputs.pairs_added || '0') < fromJson(inputs.max_new_pairs || '60') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: plan_files
          path: pf
      - name: build + chay phan ${{ matrix.part }}
        run: |
          g++ -O3 -march=native -pthread -std=c++17 scan_inverse_first2.cpp -o scanner
          K=${{ needs.plan.outputs.ktotal }}; N=${{ inputs.chunks || '20' }}; P=${{ matrix.part }}
          KB=$(python3 -c "print($K*$P//$N)"); KE=$(python3 -c "print($K*($P+1)//$N)")
          ./scanner pf/data/draws_rank.txt ${{ needs.plan.outputs.d1 }} ${{ needs.plan.outputs.d2 }} $KB $KE $(nproc) out_$P.txt ${{ inputs.min_hits || '2' }} | tee summary_$P.txt
      - uses: actions/upload-artifact@v4
        with:
          name: part_${{ matrix.part }}
          path: |
            out_*.txt
            summary_*.txt

  merge:
    needs: [plan, scan]
    if: ${{ needs.scan.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: scan-loop-merge
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag || 'lotto535-inverse-archive' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: part_*
          path: parts
          merge-multiple: true
      - name: Gop, luu gz vao repo (inverse/), ghi dau da quet
        run: |
          D1=${{ needs.plan.outputs.d1 }}; D2=${{ needs.plan.outputs.d2 }}
          mkdir -p scan_state inverse; T=scan_state/first2_${D1}_${D2}.txt
          cat parts/out_*.txt | sort -k2,2nr > full.txt
          NSEED=$(wc -l < full.txt); test "$NSEED" -gt 0
          {
            echo "SCAN_INVERSE_FIRST2 d1=$D1 d2=$D2 min_hits=${{ inputs.min_hits || '2' }}"
            echo "--- tong ket tung phan ---"; cat parts/summary_*.txt
            echo "--- tong so seed ghi: $NSEED (gz trong repo inverse/) ---"
            echo "--- 100 seed nhieu hit nhat: seed so_hit cac_ky ---"
            head -100 full.txt
          } > $T
          mkdir -p inv_new; gzip -9 -c full.txt > inv_new/first2_${D1}_${D2}.txt.gz
          pip install -q numpy pandas; python3 keep_seeds_34.py inv_new   # giu vinh vien seed hit >= 3 ky (gop them, khong mat seed cu)
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Lotto 5/35 inverse archive" --notes "File first2_D1_D2.txt.gz (seed da quet) do scan_v2_auto tao."
          gh release upload "$TAG" inv_new/*.gz --clobber
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scan_state seed_state/keep34_lotto535.txt; git commit -m "scan seed inverse ${D1}_${D2}" || true
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push origin main && break; sleep 8; done
      - name: Tu goi lai vong tiep (bo qua cap nhat du lieu)
        run: |
          N=$(( ${{ inputs.pairs_added || '0' }} + 1 ))
          gh workflow run scan_v2_auto.yml --ref main -f skip_update=true -f target=${{ inputs.target || '1' }} -f chunks=${{ inputs.chunks || '20' }} -f min_hits=${{ inputs.min_hits || '2' }} -f max_new_pairs=${{ inputs.max_new_pairs || '60' }} -f prune=${{ inputs.prune || 'false' }} -f scan_newest=${{ inputs.scan_newest || 'true' }} -f max_pairs=${{ inputs.max_pairs || '0' }} -f keep_pairs=${{ inputs.keep_pairs || '0' }} -f chon_pairs=${{ inputs.chon_pairs || '40' }} -f release_tag=${{ inputs.release_tag || 'lotto535-inverse-archive' }} -f use_pairs=${{ inputs.use_pairs || '40' }} -f so_ve=${{ inputs.so_ve || '0' }} -f levels_backfill=${{ inputs.levels_backfill || '3' }} -f pairs_added=$N

  prune:
    needs: plan
    if: ${{ needs.plan.outputs.go == 'true' && needs.plan.outputs.need_more == 'false' }}
    runs-on: ubuntu-latest
    concurrency:
      group: scan-loop-merge
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag || 'lotto535-inverse-archive' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: plan_files
          path: pf
      - name: Xoa cap thua khoi repo (inverse/), xuat ve con lai
        run: |
          cat pf/plan.json
          if [ "${{ inputs.prune || 'false' }}" = "true" ]; then
            # cua so truot: xoa gz cua cap cu hon N cap moi nhat khoi repo (dau da quet .txt van o scan_state/)
            pip install -q numpy pandas; python3 keep_seeds_34.py inverse   # chot kho seed hit >= 3 ky TRUOC khi xoa gz cu
            git add seed_state/keep34_lotto535.txt
            if [ -s pf/old_pairs.txt ]; then
              while read -r n; do echo "xoa inverse/$n"; git rm -q --ignore-unmatch "inverse/$n" || true; done < pf/old_pairs.txt
            fi
            # max_pairs=0: che do cu - tia cap thua theo bao phu
            if [ "${{ inputs.max_pairs || '0' }}" = "0" ]; then
              for p in $(python3 -c "import json;print(' '.join(json.load(open('pf/plan.json'))['drop']))"); do
                echo "xoa inverse/first2_${p}.txt.gz"; git rm -q --ignore-unmatch "inverse/first2_${p}.txt.gz" || true
              done
            fi
          fi
          mkdir -p ve_con_lai_auto; cp pf/plan.json ve_con_lai_auto/plan_lotto535.json
          cp pf/ve_con_lai_lotto535_*.txt ve_con_lai_auto/ 2>/dev/null || true
          # ve con lai chi giu 5 ky gan nhat (ve trung luu vinh vien o ve_trung/)
