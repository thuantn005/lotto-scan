  cleanup_l1:
    # Don dep l1_merged/ va l2_merged/: xoa moi file KHONG khop voi seed
    # cua cac model dang ACTIVE (FIXED_SEED_START, ONCE_SEED_START,
    # ONCE2_SEED_START, ONCE3_SEED_START co dinh; rieng seed HIEN TAI cua
    # model 5 (ONCE4) doc tu once4_seed_state.json va model 6 (ONCE5) doc
    # tu once5_seed_state.json vi 2 model nay VAN seed noi tiep, doi ten
    # file moi lan chay). Phong truong hop doi seed model trong tuong lai
    # hoac con sot file rac tu cac lan chay thu truoc - KHONG dung ban
    # seed_start cu se tu bi xoa, tranh l1_merged/l2_merged phinh to vo ich
    # theo thoi gian. Chay SAU CUNG, sau khi moi job merge/du doan da xong
    # (needs toan bo, ke ca predict_consensus - job cuoi cung trong chuoi
    # push tuan tu) de khong xoa nham file dang can dung.
    needs: [scan_and_check, merge_once, merge_once2, merge_once3, merge_once4, merge_once5, predict_consensus]
    if: ${{ needs.scan_and_check.outputs.should_run == 'true' && always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: main

      - name: Xoa file l1_merged/l2_merged khong thuoc model nao dang active
        env:
          FIXED_SEED_START: ${{ env.FIXED_SEED_START }}
          ONCE_SEED_START: ${{ env.ONCE_SEED_START }}
          ONCE2_SEED_START: ${{ env.ONCE2_SEED_START }}
          ONCE3_SEED_START: ${{ env.ONCE3_SEED_START }}
          ONCE4_STATE_FILE: ${{ env.ONCE4_STATE_FILE }}
          ONCE4_INITIAL_SEED_START: ${{ env.ONCE4_INITIAL_SEED_START }}
          ONCE5_STATE_FILE: ${{ env.ONCE5_STATE_FILE }}
          ONCE5_INITIAL_SEED_START: ${{ env.ONCE5_INITIAL_SEED_START }}
        run: |
          set -e
          python3 << 'PY'
          import json
          import os
          import re
          from pathlib import Path

          active = {
              os.environ["FIXED_SEED_START"],
              os.environ["ONCE_SEED_START"],
              os.environ["ONCE2_SEED_START"],
              os.environ["ONCE3_SEED_START"],
          }

          # Model 5 (ONCE4) va Model 6 (ONCE5) seed noi tiep: file DANG con
          # hieu luc la file ung voi last_file_seed_start trong state cua
          # tung model (hoac INITIAL neu chua chay lan nao).
          for state_file_env, initial_env in [
              ("ONCE4_STATE_FILE", "ONCE4_INITIAL_SEED_START"),
              ("ONCE5_STATE_FILE", "ONCE5_INITIAL_SEED_START"),
          ]:
              state_path = Path(os.environ[state_file_env])
              if state_path.exists():
                  state = json.loads(state_path.read_text(encoding="utf-8"))
                  last_file = state.get("last_file_seed_start")
                  if last_file is not None:
                      active.add(str(last_file))
              else:
                  active.add(os.environ[initial_env])

          print("Cac seed_start dang ACTIVE (giu lai):", sorted(active))

          removed = []
          for folder, prefix in [("l1_merged", "merged_seed"), ("l2_merged", "promoted_seed")]:
              d = Path(folder)
              if not d.exists():
                  continue
              for f in d.glob(f"{prefix}*.json"):
                  m = re.match(rf"^{prefix}(\d+)\.json$", f.name)
                  if not m:
                      continue
                  seed_start = m.group(1)
                  if seed_start not in active:
                      f.unlink()
                      removed.append(str(f))

          if removed:
              print(f"Da xoa {len(removed)} file khong thuoc model nao dang active:")
              for r in removed:
                  print(f"  - {r}")
          else:
              print("Khong co file rac nao can xoa.")
          PY

      - name: Commit don dep (neu co xoa file)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash push -u -m "cleanup l1 truoc rebase" || true
          git pull --rebase origin main
          git stash pop || true
          [ -d l1_merged ] && git add l1_merged/ || true
          [ -d l2_merged ] && git add l2_merged/ || true
          if git diff --cached --quiet; then
            echo "Khong co gi de commit"
            exit 0
          fi
          git commit -m "don dep l1_merged/l2_merged: xoa file khong thuoc model dang active $(date -u +%Y-%m-%d\ %H:%M) UTC"
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "Push thanh cong (lan thu $i)"
              break
            fi
            echo "Push bi tu choi (co the do job khac vua push truoc), thu pull --rebase roi push lai... (lan $i/5)"
            git pull --rebase origin main
            sleep $((i * 5))
            if [ "$i" = "5" ]; then
              echo "Push that bai sau 5 lan thu, dung lai"
              exit 1
            fi
          done
