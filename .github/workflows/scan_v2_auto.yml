          if missing:
              sys.exit(1)
          print("ALL 20 CHUNKS OK")
          PY

      - name: Luu lai 20 chunk vao thu muc PERSIST (de lan sau doc lai, quet gia tang)
        env:
          CHUNK_DIR: ${{ env.ONCE2_CHUNK_DIR }}
        run: |
          set -e
          mkdir -p "$CHUNK_DIR"
          for i in $(seq 0 19); do
            cp "artifacts/v2once2-chunk-${i}/chunk_${i}.json" "$CHUNK_DIR/chunk_${i}.json"
