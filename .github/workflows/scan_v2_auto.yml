    needs: [scan_and_check, scan_once2_chunk, merge_once]
    if: ${{ needs.scan_and_check.outputs.should_run == 'true' && always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: main

      - name: Download tat ca chunk artifact
        uses: actions/download-artifact@v4
        with:
          pattern: v2once2-chunk-*
          path: artifacts
          merge-multiple: false

      - name: Kiem tra du 20 chunk
        run: |
          set -e
          python3 << 'PY'
          import sys
          from pathlib import Path
          missing = [i for i in range(20)
                     if not Path(f"artifacts/v2once2-chunk-{i}/chunk_{i}.json").exists()]
