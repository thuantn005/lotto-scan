name: Full Pool Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'l1-1/**'
      - 'l1-2/**'
      - 'data/all.csv'
      - '.github/workflows/backtest.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        pool: [l1-1, l1-2]
        range:
          - { name: '006-500',  df: 6,   dt: 500  }
          - { name: '501-700',  df: 501, dt: 700  }
          - { name: '701-800',  df: 701, dt: 800  }
          - { name: '801-880',  df: 801, dt: 880  }
          - { name: '881-9999', df: 881, dt: 9999 }

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Create backtest script
        run: |
          cat > backtest_full_pool.py <<'PY'
          #!/usr/bin/env python3
          """Backtest candidate pool cho 1 pool trong 1 dai ky."""
          import csv, json, sys, inspect, os, time
          from pathlib import Path
          import numpy as np

          ROOT = Path(__file__).resolve().parent
          sys.path.insert(0, str(ROOT))
          import lotto_common as L

          POOL_NAME    = os.environ.get("POOL_NAME", "l1-1")
          DRAW_FROM    = int(os.environ.get("DRAW_FROM", 6))
          DRAW_TO      = int(os.environ.get("DRAW_TO", 10**9))
          N_STRATEGIES = int(os.environ.get("N_STRATEGIES", 10_000))
          STRAT_SEED   = int(os.environ.get("STRAT_SEED", 42))
          STRAT_CHUNK  = int(os.environ.get("STRAT_CHUNK", 100))
          SEED_KEYS    = ("seeds","winners","hits","winning_seeds",
                          "seed","result","preds","predictions")


          def _extract_seeds(data):
              if isinstance(data, list):
                  out = []
                  for x in data:
                      if isinstance(x, (int, np.integer)):
                          out.append(int(x))
                      elif isinstance(x, dict) and "seed" in x:
                          try: out.append(int(x["seed"]))
                          except Exception: pass
                  return out
              if isinstance(data, dict):
                  for k in SEED_KEYS:
                      if k in data:
                          return _extract_seeds(data[k])
              return []


          def load_pool(folder):
              out = []
              if not folder.exists():
                  return out
              for fp in sorted(folder.glob("*.json")):
                  try: did = int(fp.stem)
                  except ValueError: continue
                  try: data = json.loads(fp.read_text(encoding="utf-8"))
                  except Exception: continue
                  for s in _extract_seeds(data):
                      out.append((did, s))
              out.sort()
              return out


          def load_actual(csv_path):
              res = {}
              if not csv_path.exists(): return res
              with csv_path.open(encoding="utf-8") as f:
                  r = csv.reader(f); next(r, None)
                  for row in r:
                      if len(row) < 5: continue
                      try:
                          did = int(row[1]); p = json.loads(row[4])
                          nums = sorted(int(x) for x in p["numbers"])
                          sp = int(p["special_numbers"][0])
                          res[did] = (nums, sp)
                      except Exception: continue
              return res


          def make_strategies(n, seed):
              rng = np.random.default_rng(seed)
              W = rng.standard_normal((4, n)).astype(np.float32)
              W /= np.linalg.norm(W, axis=0, keepdims=True) + 1e-12
              return W


          def build_features(known, d):
              if len(known) < 3: return None, None
              n = len(known)
              seeds = np.fromiter((s for _, s in known), dtype=np.int64, count=n)
              dids  = np.fromiter((x for x, _ in known), dtype=np.int64, count=n)
              uniq, inv, counts = np.unique(seeds, return_inverse=True,
                                            return_counts=True)
              inv = inv.astype(np.int64, copy=False)
              freq = counts[inv].astype(np.float32)
              last_did = np.full(len(uniq), -1, dtype=np.int64)
              np.maximum.at(last_did, inv, dids)
              last_arr = last_did[inv]
              gap = ((d - 1) - last_arr).astype(np.float32)
              order = np.argsort(-last_did, kind="stable")
              rank_uniq = np.empty_like(order); rank_uniq[order] = np.arange(len(order))
              rank = rank_uniq[inv].astype(np.float32)

              def nz(a):
                  m = float(a.max()) if a.size else 0.0
                  return a / m if m > 0 else a

              F = np.stack([nz(freq), nz(-gap), nz(-rank),
                            nz(-seeds.astype(np.float32))],
                           axis=1).astype(np.float32)
              return seeds, F


          def _call_predict(seed, d, rank_to_mask, binom):
              fn = L.predict_ticket
              n = len(inspect.signature(fn).parameters)
              for args in [(seed,d,rank_to_mask),
                           (seed,d,rank_to_mask,binom),
                           (seed,d)][:n]:
                  try: res = fn(*args)
                  except TypeError: continue
                  if isinstance(res, tuple) and len(res) == 2:
                      a, b = res
                      if isinstance(a, (list, tuple, np.ndarray)) and \
                         isinstance(b, (int, np.integer)):
                          return sorted(int(x) for x in a), int(b)
                      if isinstance(a, dict) and "numbers" in a:
                          sp = a.get("special") or a.get("special_numbers") or b
                          if isinstance(sp, (list, tuple, np.ndarray)): sp = sp[0]
                          return sorted(int(x) for x in a["numbers"]), int(sp)
                  if isinstance(res, dict) and "numbers" in res:
                      sp = res.get("special") or res.get("special_numbers")
                      if isinstance(sp, (list, tuple, np.ndarray)): sp = sp[0]
                      return sorted(int(x) for x in res["numbers"]), int(sp)
              raise RuntimeError("Khong khop chu ky predict_ticket")


          def main():
              print(f"Pool={POOL_NAME} range={DRAW_FROM}..{DRAW_TO} "
                    f"N={N_STRATEGIES} chunk={STRAT_CHUNK}", flush=True)
              pool = load_pool(ROOT / POOL_NAME)
              if not pool:
                  print(f"[skip] {POOL_NAME} rong"); return
              print(f"Pool {POOL_NAME}: {len(pool):,} seed, "
                    f"ky {pool[0][0]}..{pool[-1][0]}", flush=True)

              actual = load_actual(ROOT / "data" / "all.csv")
              W = make_strategies(N_STRATEGIES, STRAT_SEED)
              binom = L.build_binom()
              rank_to_mask = L.build_rank_to_mask(binom)

              rows = []
              n_strat = W.shape[1]
              t0 = time.time()
              processed = 0
              for d in sorted(actual.keys()):
                  if d <= 5 or d < DRAW_FROM or d > DRAW_TO:
                      continue
                  a_nums, a_sp = actual[d]
                  a_set = set(a_nums)
                  known = [(did, s) for did, s in pool if did <= d - 5]
                  seeds, F = build_features(known, d)
                  if seeds is None: continue

                  cache = {}
                  def get_ticket(s):
                      t = cache.get(s)
                      if t is None:
                          t = _call_predict(s, d, rank_to_mask, binom)
                          cache[s] = t
                      return t

                  for start in range(0, n_strat, STRAT_CHUNK):
                      end = min(start + STRAT_CHUNK, n_strat)
                      Wc = W[:, start:end]
                      S = F @ Wc
                      k = min(3, S.shape[0])
                      topk = np.argpartition(-S, k - 1, axis=0)[:k]
                      top_seeds = seeds[topk]
                      for jj in range(top_seeds.shape[1]):
                          sid = start + jj
                          for r in range(k):
                              s = int(top_seeds[r, jj])
                              nums, sp = get_ticket(s)
                              n_match = len(a_set.intersection(nums))
                              sp_hit  = int(sp == a_sp)
                              rows.append((d, sid, r + 1, s, n_match, sp_hit,
                                           int(n_match == 5 and sp_hit)))
                  processed += 1
                  if processed % 10 == 0:
                      dt = time.time() - t0
                      print(f"  [{POOL_NAME}] ky {d} - pool {len(known):,} "
                            f"- {processed} ky / {dt:.1f}s", flush=True)

              out = ROOT / f"backtest_full_pool_{POOL_NAME}_part_{DRAW_FROM:04d}_{DRAW_TO:04d}.csv"
              with out.open("w", newline="", encoding="utf-8") as f:
                  w = csv.writer(f)
                  w.writerow(["draw_id","strategy_id","ticket_rank","seed",
                              "n_match","special_hit","is_j1"])
                  w.writerows(rows)
              arr = np.asarray(rows, dtype=np.int64)
              print(f"  Tong ve       : {len(arr):,}")
              if len(arr):
                  print(f"  Trung TB / 5  : {arr[:,4].mean():.4f}")
                  print(f"  Trung DB      : {int(arr[:,5].sum()):,} "
                        f"({arr[:,5].mean()*100:.3f}%)")
                  print(f"  J1 (5/5 + DB) : {int(arr[:,6].sum()):,}")
              print(f"  Ghi -> {out.name}", flush=True)


          if __name__ == "__main__":
              main()
          PY
          python -c "import ast; ast.parse(open('backtest_full_pool.py').read()); print('Syntax OK')"

      - name: Run backtest
        env:
          POOL_NAME:    ${{ matrix.pool }}
          DRAW_FROM:    ${{ matrix.range.df }}
          DRAW_TO:      ${{ matrix.range.dt }}
          N_STRATEGIES: '10000'
          STRAT_CHUNK:  '100'
        run: python backtest_full_pool.py

      - name: Upload part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.pool }}-${{ matrix.range.name }}
          path: backtest_full_pool_*_part_*.csv
          if-no-files-found: warn
          retention-days: 7

  merge:
    needs: backtest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all parts
        uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: part-*
          merge-multiple: true

      - name: Show downloaded files
        run: ls -la parts/ || true

      - name: Merge per pool
        run: |
          for pool in l1-1 l1-2; do
            out="backtest_full_pool_${pool}.csv"
            first=1
            : > "$out"
            for f in $(ls parts/backtest_full_pool_${pool}_part_*.csv 2>/dev/null | sort); do
              if [ $first -eq 1 ]; then
                cat "$f" > "$out"
                first=0
              else
                tail -n +2 "$f" >> "$out"
              fi
            done
            if [ -s "$out" ]; then
              echo "=== $out ==="
              wc -l "$out"
              head -2 "$out"
              gzip -k "$out"
            else
              echo "[warn] $out rong"
            fi
          done
          ls -la backtest_full_pool_*.csv* 2>/dev/null || true

      - name: Upload merged CSVs
        uses: actions/upload-artifact@v4
        with:
          name: backtest-final
          path: |
            backtest_full_pool_l1-1.csv
            backtest_full_pool_l1-1.csv.gz
            backtest_full_pool_l1-2.csv
            backtest_full_pool_l1-2.csv.gz
          if-no-files-found: warn
          retention-days: 30
