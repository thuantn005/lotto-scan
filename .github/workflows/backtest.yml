name: Full Pool Backtest

on:
  workflow_dispatch:
    inputs:
      strat_chunk:
        description: 'So chien luoc moi chunk (mac dinh 100)'
        required: false
        default: '100'
  push:
    branches: [main]
    paths:
      - 'l1-1/**'
      - 'l1-2/**'
      - 'data/all.csv'
      - '.github/workflows/backtest.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Show pool ranges
        run: |
          echo "=== l1-1 ==="; ls l1-1/ 2>/dev/null | head -1; ls l1-1/ 2>/dev/null | tail -1; ls l1-1/ 2>/dev/null | wc -l
          echo "=== l1-2 ==="; ls l1-2/ 2>/dev/null | head -1; ls l1-2/ 2>/dev/null | tail -1; ls l1-2/ 2>/dev/null | wc -l

      - name: Create scripts
        run: |
          cat > _inspect.py <<'PY'
          import json, re
          from pathlib import Path
          ROOT = Path(__file__).resolve().parent
          for name in ("l1-1", "l1-2"):
              d = ROOT / name
              print(f"\n=== {name} ===")
              if not d.exists():
                  print("  KHONG TON TAI"); continue
              files = sorted(d.glob("*.json"))
              print(f"  {len(files)} file JSON")
              if not files: continue
              fp = files[0]
              print(f"  Mau: {fp.name}")
              try:
                  data = json.loads(fp.read_text(encoding="utf-8"))
                  if isinstance(data, dict):
                      print(f"  Keys: {list(data.keys())}")
                      for k, v in data.items():
                          if isinstance(v, list) and v:
                              print(f"    {k}: list[{len(v)}], mau={v[:3]}")
                  elif isinstance(data, list):
                      print(f"  List[{len(data)}], mau={data[:3]}")
              except Exception as e:
                  print("  Loi:", e)
          print("\n=== data/all.csv ===")
          p = ROOT / "data" / "all.csv"
          if p.exists():
              with p.open(encoding="utf-8") as f:
                  for i, line in enumerate(f):
                      print(f"  {i}: {line.rstrip()[:160]}")
                      if i >= 3: break
          else:
              print("  KHONG TON TAI")
          print("\n=== lotto_common.py ===")
          p = ROOT / "lotto_common.py"
          if p.exists():
              src = p.read_text(encoding="utf-8")
              for m in re.finditer(r"^def\s+(\w+)\s*\(([^)]*)\)", src, re.M):
                  print(f"  def {m.group(1)}({m.group(2)})")
          else:
              print("  KHONG TON TAI")
          PY

          cat > backtest_full_pool.py <<'PY'
          #!/usr/bin/env python3
          """Backtest candidate pool day du cho 2 model l1-1, l1-2.
          - Moi pool co range ky rieng, khong gop.
          - Voi ky d: dung seed co draw_id <= d-5.
          - 10.000 chien luoc, chia chunk de tiet kiem RAM.
          """
          import csv, json, sys, inspect, os, time
          from pathlib import Path
          from collections import defaultdict
          import numpy as np

          ROOT = Path(__file__).resolve().parent
          sys.path.insert(0, str(ROOT))
          import lotto_common as L

          N_STRATEGIES = int(os.environ.get("N_STRATEGIES", 10_000))
          STRAT_SEED   = int(os.environ.get("STRAT_SEED", 42))
          STRAT_CHUNK  = int(os.environ.get("STRAT_CHUNK", 100))
          POOLS        = ["l1-1", "l1-2"]
          SEED_KEYS    = ("seeds", "winners", "hits", "winning_seeds",
                          "seed", "result", "preds", "predictions")


          def _extract_seeds(data):
              if isinstance(data, list):
                  out = []
                  for x in data:
                      if isinstance(x, (int, np.integer)):
                          out.append(int(x))
                      elif isinstance(x, dict) and "seed" in x:
                          try: out.append(int(x["seed"]))
                          except Exception: pass
                  return out
              if isinstance(data, dict):
                  for k in SEED_KEYS:
                      if k in data:
                          return _extract_seeds(data[k])
              return []


          def load_pool(folder):
              out = []
              if not folder.exists():
                  print(f"[warn] thieu {folder}", flush=True)
                  return out
              for fp in sorted(folder.glob("*.json")):
                  try:
                      did = int(fp.stem)
                  except ValueError:
                      continue
                  try:
                      data = json.loads(fp.read_text(encoding="utf-8"))
                  except Exception:
                      continue
                  for s in _extract_seeds(data):
                      out.append((did, s))
              out.sort()
              return out


          def load_actual(csv_path):
              res = {}
              if not csv_path.exists():
                  return res
              with csv_path.open(encoding="utf-8") as f:
                  r = csv.reader(f)
                  next(r, None)
                  for row in r:
                      if len(row) < 5:
                          continue
                      try:
                          did = int(row[1])
                          p = json.loads(row[4])
                          nums = sorted(int(x) for x in p["numbers"])
                          sp = int(p["special_numbers"][0])
                          res[did] = (nums, sp)
                      except Exception:
                          continue
              return res


          def make_strategies(n=N_STRATEGIES, seed=STRAT_SEED):
              rng = np.random.default_rng(seed)
              W = rng.standard_normal((4, n)).astype(np.float32)
              W /= np.linalg.norm(W, axis=0, keepdims=True) + 1e-12
              return W


          def build_features(known, d):
              """known: list (draw_id, seed) da sort theo draw_id."""
              if len(known) < 3:
                  return None, None
              n = len(known)
              seeds = np.fromiter((s for _, s in known), dtype=np.int64, count=n)
              dids  = np.fromiter((x for x, _ in known), dtype=np.int64, count=n)

              uniq, inv, counts = np.unique(seeds, return_inverse=True,
                                            return_counts=True)
              inv = inv.astype(np.int64, copy=False)
              freq = counts[inv].astype(np.float32)

              last_did = np.full(len(uniq), -1, dtype=np.int64)
              np.maximum.at(last_did, inv, dids)
              last_arr = last_did[inv]
              gap = ((d - 1) - last_arr).astype(np.float32)

              order = np.argsort(-last_did, kind="stable")
              rank_uniq = np.empty_like(order)
              rank_uniq[order] = np.arange(len(order))
              rank = rank_uniq[inv].astype(np.float32)

              def nz(a):
                  m = float(a.max()) if a.size else 0.0
                  return a / m if m > 0 else a

              F = np.stack([
                  nz(freq),
                  nz(-gap),
                  nz(-rank),
                  nz(-seeds.astype(np.float32)),
              ], axis=1).astype(np.float32)
              return seeds, F


          def _call_predict(seed, d, rank_to_mask, binom):
              fn = L.predict_ticket
              n = len(inspect.signature(fn).parameters)
              trials = [(seed, d, rank_to_mask),
                        (seed, d, rank_to_mask, binom),
                        (seed, d)]
              for args in trials[:n]:
                  try:
                      res = fn(*args)
                  except TypeError:
                      continue
                  if isinstance(res, tuple) and len(res) == 2:
                      a, b = res
                      if isinstance(a, (list, tuple, np.ndarray)) and \
                         isinstance(b, (int, np.integer)):
                          return sorted(int(x) for x in a), int(b)
                      if isinstance(a, dict) and "numbers" in a:
                          sp = a.get("special") or a.get("special_numbers") or b
                          if isinstance(sp, (list, tuple, np.ndarray)):
                              sp = sp[0]
                          return sorted(int(x) for x in a["numbers"]), int(sp)
                  if isinstance(res, dict) and "numbers" in res:
                      sp = res.get("special") or res.get("special_numbers")
                      if isinstance(sp, (list, tuple, np.ndarray)):
                          sp = sp[0]
                      return sorted(int(x) for x in res["numbers"]), int(sp)
              raise RuntimeError("Khong khop chu ky predict_ticket")


          def backtest_pool(pool, actual, W, rank_to_mask, binom, pool_name):
              rows = []
              n_strat = W.shape[1]
              n_chunk = (n_strat + STRAT_CHUNK - 1) // STRAT_CHUNK
              t0 = time.time()
              processed = 0
              for d in sorted(actual.keys()):
                  if d <= 5:
                      continue
                  a_nums, a_sp = actual[d]
                  a_set = set(a_nums)
                  known = [(did, s) for did, s in pool if did <= d - 5]
                  seeds, F = build_features(known, d)
                  if seeds is None:
                      continue

                  cache = {}
                  def get_ticket(s):
                      t = cache.get(s)
                      if t is None:
                          t = _call_predict(s, d, rank_to_mask, binom)
                          cache[s] = t
                      return t

                  for start in range(0, n_strat, STRAT_CHUNK):
                      end = min(start + STRAT_CHUNK, n_strat)
                      Wc = W[:, start:end]
                      S = F @ Wc
                      k = min(3, S.shape[0])
                      topk = np.argpartition(-S, k - 1, axis=0)[:k]
                      top_seeds = seeds[topk]
                      for jj in range(top_seeds.shape[1]):
                          sid = start + jj
                          for r in range(k):
                              s = int(top_seeds[r, jj])
                              nums, sp = get_ticket(s)
                              n_match = len(a_set.intersection(nums))
                              sp_hit  = int(sp == a_sp)
                              rows.append((d, sid, r + 1, s, n_match, sp_hit,
                                           int(n_match == 5 and sp_hit)))

                  processed += 1
                  if processed % 20 == 0:
                      dt = time.time() - t0
                      print(f"  [{pool_name}] ky {d} - pool {len(known):,} seed "
                            f"- {processed} ky / {dt:.1f}s", flush=True)
              return rows


          def main():
              print(f"Cau hinh: N_STRATEGIES={N_STRATEGIES}, "
                    f"STRAT_CHUNK={STRAT_CHUNK}, STRAT_SEED={STRAT_SEED}",
                    flush=True)
              actual = load_actual(ROOT / "data" / "all.csv")
              print(f"Ky co ket qua: {len(actual)}", flush=True)
              if not actual:
                  sys.exit("Khong doc duoc data/all.csv")
              W = make_strategies()
              binom = L.build_binom()
              rank_to_mask = L.build_rank_to_mask(binom)
              summary = []
              for name in POOLS:
                  t0 = time.time()
                  pool = load_pool(ROOT / name)
                  if not pool:
                      print(f"[skip] {name} rong", flush=True)
                      continue
                  print(f"\n=== Pool {name}: {len(pool):,} seed, "
                        f"ky {pool[0][0]}..{pool[-1][0]} ===", flush=True)
                  rows = backtest_pool(pool, actual, W, rank_to_mask,
                                       binom, name)
                  out = ROOT / f"backtest_full_pool_{name}.csv"
                  with out.open("w", newline="", encoding="utf-8") as f:
                      w = csv.writer(f)
                      w.writerow(["draw_id", "strategy_id", "ticket_rank",
                                  "seed", "n_match", "special_hit", "is_j1"])
                      w.writerows(rows)
                  arr = np.asarray(rows, dtype=np.int64)
                  n = len(arr)
                  dt = time.time() - t0
                  if n == 0:
                      print(f"  (khong co ve) - {dt:.1f}s", flush=True)
                      continue
                  print(f"  Tong ve       : {n:,}")
                  print(f"  Trung TB / 5  : {arr[:,4].mean():.4f}")
                  print(f"  Trung DB      : {int(arr[:,5].sum()):,} "
                        f"({arr[:,5].mean()*100:.3f}%)")
                  print(f"  J1 (5/5 + DB) : {int(arr[:,6].sum()):,}")
                  print(f"  Ghi -> {out.name}  ({dt:.1f}s)", flush=True)
                  summary.append((name, n, arr[:,4].mean(),
                                  int(arr[:,5].sum()), int(arr[:,6].sum())))
              print("\n=== TONG HOP ===")
              print(f"{'pool':<6} {'ve':>12} {'TB/5':>8} {'DB':>8} {'J1':>6}")
              for s in summary:
                  print(f"{s[0]:<6} {s[1]:>12,} {s[2]:>8.4f} "
                        f"{s[3]:>8,} {s[4]:>6,}")


          if __name__ == "__main__":
              main()
          PY
          python -c "import ast; ast.parse(open('_inspect.py').read()); ast.parse(open('backtest_full_pool.py').read()); print('Syntax OK')"

      - name: Inspect repo structure
        run: python _inspect.py || true

      - name: Run full pool backtest
        env:
          STRAT_CHUNK: ${{ github.event.inputs.strat_chunk || '100' }}
        run: python backtest_full_pool.py

      - name: Compress CSVs
        if: always()
        run: |
          for f in backtest_full_pool_*.csv; do
            [ -f "$f" ] && gzip -k "$f" || true
          done

      - name: Upload result CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            backtest_full_pool_*.csv
            backtest_full_pool_*.csv.gz
          if-no-files-found: warn
          retention-days: 30
