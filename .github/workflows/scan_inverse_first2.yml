name: scan_inverse_first2 (noi tiep nhieu cap d1:d2, hit dau = d1, hit thu 2 = d2)

on:
  workflow_dispatch:
    inputs:
      queue:
        description: "Hang doi cap d1:d2 (d1<d2) cach nhau dau phay. Cap dau chay truoc, phan con lai tu dispatch tiep"
        default: "972:973,968:969,966:967,964:965,962:963,960:961,958:959,956:957,954:955,952:953,950:951,948:949,946:947,944:945"
      chunks:
        description: "So job chia khong gian k (<=20 de chay song song)"
        default: "20"
      min_hits:
        description: "Ghi seed co tong >= so ky trung nay (2 = ghi moi seed hop le)"
        default: "2"

permissions:
  contents: write
  actions: write

concurrency:
  group: scan-inverse-first2
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      ktotal: ${{ steps.m.outputs.ktotal }}
      d1: ${{ steps.m.outputs.d1 }}
      d2: ${{ steps.m.outputs.d2 }}
      rest: ${{ steps.m.outputs.rest }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          QUEUE: ${{ inputs.queue }}
          CHUNKS: ${{ inputs.chunks }}
        run: |
          python3 make_draws_rank.py
          python3 - <<'PY'
          import os, json
          rows = {int(l.split()[0]): (int(l.split()[1]), int(l.split()[2])) for l in open("data/draws_rank.txt")}
          items = [x.strip() for x in os.environ["QUEUE"].split(",") if x.strip()]
          # bo cac cap da co ket qua, khong hop le, hoac khong thoa d1 < d2
          todo = []
          for it in items:
              a, b = (int(v) for v in it.split(":"))
              if a in rows and b in rows and a < b and not os.path.exists(f"inverse/first2_{a}_{b}.txt"):
                  todo.append((a, b))
          assert todo, "hang doi rong"
          d1, d2 = todo[0]; rest = ",".join(f"{a}:{b}" for a, b in todo[1:])
          n = int(os.environ["CHUNKS"])
          ktot = (2**64 - 1 - rows[d1][0]) // 324632 + 1
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps(list(range(n))) + "\n")
              f.write(f"ktotal={ktot}\nd1={d1}\nd2={d2}\nrest={rest}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: draws_rank
          path: data/draws_rank.txt

  scan:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: draws_rank
          path: data
      - name: build
        run: g++ -O3 -march=native -pthread -std=c++17 scan_inverse_first2.cpp -o scan_inverse_first2
      - name: run chunk
        run: |
          K=${{ needs.prepare.outputs.ktotal }}; N=${{ inputs.chunks }}; P=${{ matrix.part }}
          KB=$(python3 -c "print($K*$P//$N)"); KE=$(python3 -c "print($K*($P+1)//$N)")
          ./scan_inverse_first2 data/draws_rank.txt ${{ needs.prepare.outputs.d1 }} ${{ needs.prepare.outputs.d2 }} $KB $KE $(nproc) out_$P.txt ${{ inputs.min_hits }} | tee summary_$P.txt
      - uses: actions/upload-artifact@v4
        with:
          name: part_${{ matrix.part }}
          path: |
            out_*.txt
            summary_*.txt

  merge:
    needs: [prepare, scan]
    # chi gop + noi tiep khi TAT CA phan quet thanh cong (tranh ghi ket qua thieu)
    if: ${{ needs.scan.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: part_*
          path: parts
          merge-multiple: true
      - name: gop ket qua
        run: |
          D1=${{ needs.prepare.outputs.d1 }}; D2=${{ needs.prepare.outputs.d2 }}
          mkdir -p inverse; T=inverse/first2_${D1}_${D2}.txt
          cat parts/out_*.txt | sort -k2,2nr > full.txt
          {
            echo "SCAN_INVERSE_FIRST2 d1=$D1 (hit dau) d2=$D2 (hit thu 2), min_hits=${{ inputs.min_hits }}"
            echo "--- tong ket tung phan ---"; cat parts/summary_*.txt
            echo "--- tong so seed ghi: $(wc -l < full.txt) (toan bo trong file .txt.gz cung ten) ---"
            echo "--- 100 seed nhieu hit nhat: seed so_hit cac_ky ---"
            head -100 full.txt
          } > $T
          gzip -9 -c full.txt > $T.gz
          ls -l $T $T.gz
          git config user.name github-actions; git config user.email actions@github.com
          git add inverse; git commit -m "scan_inverse_first2 ${D1}_${D2}" || true
          git pull --rebase || true; git push
      - name: chay cap ke tiep
        if: ${{ needs.prepare.outputs.rest != '' }}
        run: |
          gh workflow run scan_inverse_first2.yml -f queue="${{ needs.prepare.outputs.rest }}" -f chunks=${{ inputs.chunks }} -f min_hits=${{ inputs.min_hits }}
