name: Benchmark Speed

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Fetch data
        run: |
          python3 << 'PYEOF'
          import requests, os
          os.makedirs('data', exist_ok=True)
          r = requests.get('https://raw.githubusercontent.com/NhanAZ-Data/vietlott-research/main/datasets/draws/lotto535/all.csv', timeout=60)
          open('data/all.csv', 'w').write(r.text)
          print('Downloaded ' + str(len(r.text.splitlines())) + ' rows')
          PYEOF
      - name: Benchmark
        run: python benchmark_gh.py
