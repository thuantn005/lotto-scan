name: scan_inverse_auto_prune (quet cap moi cho den khi con target ve, roi tia cap cu thua)

# Chay: Actions -> scan_inverse_auto_prune -> Run workflow (game = lotto535 hoac mega).
# Vong lap: tinh ve con lai cho ky next_draw bang tat ca cap tren Release
#   - con lai > target : quet them 1 cap moi (20 job song song), gz len Release, tu goi lai chinh no
#   - con lai <= target: chon tap cap NHO NHAT van du de con lai <= target, xoa gz cua cap thua khoi Release
#                        (giu file .txt tom tat trong repo lam dau "da quet", de khong quet lai), xuat danh sach ve con lai.
# Can: da chay archive_to_release.yml (gz nam tren Release), auto_prune.py + make_draws_rank*.py + scanner .cpp trong repo.

on:
  workflow_dispatch:
    inputs:
      game:
        description: "lotto535 hoac mega"
        default: "lotto535"
      target:
        description: "So ve con lai muc tieu"
        default: "1"
      next_draw:
        description: "Ky can tinh (de trong = ky moi nhat trong du lieu + 1)"
        default: ""
      chunks:
        description: "So job song song (<=20)"
        default: "20"
      min_hits:
        description: "Ghi seed co tong >= so ky trung nay"
        default: "2"
      max_new_pairs:
        description: "Toi da so cap quet moi trong 1 chuoi chay (chong chay vo han)"
        default: "500"
      prune:
        description: "Tu xoa cap thua khi da dat target (true/false)"
        default: "true"
      pairs_added:
        description: "(noi bo) so cap da quet trong chuoi nay"
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: scan-inverse-auto-prune-${{ inputs.game }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GAME: ${{ inputs.game }}
    outputs:
      need_more: ${{ steps.p.outputs.need_more }}
      d1: ${{ steps.p.outputs.d1 }}
      d2: ${{ steps.p.outputs.d2 }}
      ktotal: ${{ steps.p.outputs.ktotal }}
      tag: ${{ steps.cfg.outputs.tag }}
      matrix: ${{ steps.p.outputs.matrix }}
      nxt: ${{ steps.p.outputs.nxt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas
      - id: cfg
        run: |
          if [ "$GAME" = "mega" ]; then
            echo "tag=mega-inverse-archive" >> $GITHUB_OUTPUT
          else
            echo "tag=lotto535-inverse-archive" >> $GITHUB_OUTPUT
          fi
      - name: tai gz tu Release
        run: |
          mkdir -p rel
          gh release download "${{ steps.cfg.outputs.tag }}" --pattern '*.txt.gz' --dir rel 2>/dev/null || echo "chua co Release/asset"
          ls rel | wc -l
      - id: p
        env:
          NEXT_IN: ${{ inputs.next_draw }}
          TARGET: ${{ inputs.target }}
          CHUNKS: ${{ inputs.chunks }}
        run: |
          if [ "$GAME" = "mega" ]; then python3 make_draws_rank_mega.py; RANK=data/draws_rank_mega.txt; MARK=scan_state; PRE=first2_mega_; MOD=8145060
          else python3 make_draws_rank.py; RANK=data/draws_rank.txt; MARK=scan_state; PRE=first2_; MOD=324632; fi
          python3 - <<PY
          import os, json, re
          rank = "$RANK"; mark = "$MARK"; pre = "$PRE"; mod = $MOD
          rows = {int(l.split()[0]): int(l.split()[1]) for l in open(rank)}
          last = max(rows)
          nxt = int(os.environ["NEXT_IN"] or last + 1)
          open("nxt.txt", "w").write(str(nxt))
          PY
          NXT=$(cat nxt.txt)
          python3 auto_prune.py "$GAME" rel "$NXT" "$TARGET"
          python3 - <<PY
          import os, json, re
          plan = json.load(open("plan.json"))
          rank = "$RANK"; mark = "$MARK"; pre = "$PRE"; mod = $MOD
          rows = {int(l.split()[0]): int(l.split()[1]) for l in open(rank)}
          out = {"need_more": "true" if plan["need_more"] else "false", "nxt": plan["next_draw"]}
          if plan["need_more"]:
              done = set()
              for f in (os.listdir(mark) if os.path.isdir(mark) else []):
                  m = re.fullmatch(re.escape(pre) + r"(\d+)_(\d+)\.txt", f)
                  if m: done.add((int(m.group(1)), int(m.group(2))))
              top = max(rows); pref = (top - 1) % 2
              cand = [(a, a + 1) for a in range(top - 1, 0, -1) if a in rows and a + 1 in rows and (a, a + 1) not in done]
              assert cand, "het cap de quet"
              cand.sort(key=lambda p: (p[0] % 2 != pref, -p[0]))
              d1, d2 = cand[0]
              out.update(d1=d1, d2=d2, ktotal=(2**64 - 1 - rows[d1]) // mod + 1, matrix=json.dumps(list(range(int(os.environ["CHUNKS"])))))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for k, v in out.items(): f.write(f"{k}={v}\n")
          print(out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: plan_files
          path: |
            plan.json
            ve_con_lai_*.txt
            data/draws_rank*.txt
          if-no-files-found: ignore

  scan:
    needs: plan
    if: ${{ needs.plan.outputs.need_more == 'true' && fromJson(inputs.pairs_added) < fromJson(inputs.max_new_pairs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plan_files
          path: pf
      - name: build + run chunk
        env:
          GAME: ${{ inputs.game }}
        run: |
          if [ "$GAME" = "mega" ]; then SRC=scan_inverse_first2_mega.cpp; RANK=pf/data/draws_rank_mega.txt; else SRC=scan_inverse_first2.cpp; RANK=pf/data/draws_rank.txt; fi
          g++ -O3 -march=native -pthread -std=c++17 $SRC -o scanner
          K=${{ needs.plan.outputs.ktotal }}; N=${{ inputs.chunks }}; P=${{ matrix.part }}
          KB=$(python3 -c "print($K*$P//$N)"); KE=$(python3 -c "print($K*($P+1)//$N)")
          ./scanner $RANK ${{ needs.plan.outputs.d1 }} ${{ needs.plan.outputs.d2 }} $KB $KE $(nproc) out_$P.txt ${{ inputs.min_hits }} | tee summary_$P.txt
      - uses: actions/upload-artifact@v4
        with:
          name: part_${{ matrix.part }}
          path: |
            out_*.txt
            summary_*.txt

  merge:
    needs: [plan, scan]
    if: ${{ needs.scan.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GAME: ${{ inputs.game }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: part_*
          path: parts
          merge-multiple: true
      - name: gop, gz len Release, ghi dau da quet
        run: |
          D1=${{ needs.plan.outputs.d1 }}; D2=${{ needs.plan.outputs.d2 }}
          MARK=scan_state; if [ "$GAME" = "mega" ]; then PRE=first2_mega_; else PRE=first2_; fi
          mkdir -p $MARK /tmp/gz; T=$MARK/${PRE}${D1}_${D2}.txt
          cat parts/out_*.txt | sort -k2,2nr > full.txt
          NSEED=$(wc -l < full.txt); test "$NSEED" -gt 0
          {
            echo "SCAN_INVERSE_FIRST2 game=$GAME d1=$D1 d2=$D2 min_hits=${{ inputs.min_hits }}"
            echo "--- tong ket tung phan ---"; cat parts/summary_*.txt
            echo "--- tong so seed ghi: $NSEED (gz tren Release $TAG) ---"
            echo "--- 100 seed nhieu hit nhat: seed so_hit cac_ky ---"
            head -100 full.txt
          } > $T
          gzip -9 -c full.txt > /tmp/gz/${PRE}${D1}_${D2}.txt.gz
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "seed da quet (workflow scan_inverse_auto_prune)"
          gh release upload "$TAG" /tmp/gz/*.gz --clobber
          git config user.name github-actions; git config user.email actions@github.com
          git add $MARK; git commit -m "scan $GAME ${D1}_${D2}" || true
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 8; done
      - name: chay vong tiep
        run: |
          N=$(( ${{ inputs.pairs_added }} + 1 ))
          gh workflow run scan_inverse_auto_prune.yml -f game=$GAME -f target=${{ inputs.target }} -f next_draw="${{ inputs.next_draw }}" -f chunks=${{ inputs.chunks }} -f min_hits=${{ inputs.min_hits }} -f max_new_pairs=${{ inputs.max_new_pairs }} -f prune=${{ inputs.prune }} -f pairs_added=$N

  prune:
    needs: plan
    if: ${{ needs.plan.outputs.need_more == 'false' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GAME: ${{ inputs.game }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plan_files
          path: pf
      - name: xoa cap thua, xuat ve con lai
        run: |
          if [ "$GAME" = "mega" ]; then PRE=first2_mega_; else PRE=first2_; fi
          cat pf/plan.json
          if [ "${{ inputs.prune }}" = "true" ]; then
            for p in $(python3 -c "import json;print(' '.join(json.load(open('pf/plan.json'))['drop']))"); do
              echo "xoa ${PRE}${p}.txt.gz khoi Release"
              gh release delete-asset "$TAG" "${PRE}${p}.txt.gz" -y || true
            done
          fi
          cp pf/plan.json plan_${GAME}.json
          gh release upload "$TAG" plan_${GAME}.json pf/ve_con_lai_${GAME}_*.txt --clobber || true
          mkdir -p ve_con_lai_auto; cp pf/ve_con_lai_${GAME}_*.txt plan_${GAME}.json ve_con_lai_auto/ 2>/dev/null || true
          git config user.name github-actions; git config user.email actions@github.com
          git add ve_con_lai_auto; git commit -m "ve con lai $GAME ky ${{ needs.plan.outputs.nxt }}" || true
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 8; done
