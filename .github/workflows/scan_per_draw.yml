name: Scan Per-Draw (dai seed co dinh, moi ky 1 file)

on:
  workflow_dispatch: {}

env:
  FIXED_SEED_START: "682305800400"
  FIXED_SEED_COUNT: "1557775799"

permissions:
  contents: write

jobs:
  scan_per_draw:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Download dataset moi nhat
        run: |
          set -e
          mkdir -p data
          curl -sL "https://raw.githubusercontent.com/NhanAZ-Data/vietlott-research/main/datasets/draws/lotto535/all.csv" -o data/all.csv
          wc -l data/all.csv

      - name: Compile scan_per_draw (co pthread cho da luong)
        run: g++ -O3 -march=x86-64-v3 -funroll-loops -std=c++17 -pthread -o scan_per_draw scan_per_draw.cpp

      - name: Xem so core cua runner
        run: nproc

      - name: Quet dai seed co dinh cho TAT CA cac ky (moi ky 1 file, luu vao l1/)
        env:
          CSV_PATH: data/all.csv
          OUT_DIR: l1
          SEED_START: ${{ env.FIXED_SEED_START }}
          SEED_COUNT: ${{ env.FIXED_SEED_COUNT }}
        run: ./scan_per_draw

      - name: Commit ket qua
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash push -u -m "ket qua truoc rebase" || true
          git pull --rebase origin main
          git stash pop || true
          [ -d l1 ] && git add l1/ || true
          if git diff --cached --quiet; then
            echo "Khong co gi de commit"
            exit 0
          fi
          git commit -m "scan per-draw: dai seed $FIXED_SEED_START (+$FIXED_SEED_COUNT), $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git push origin main
